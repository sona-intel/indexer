name: sona-x402-arc
schema: schema.arc.graphql
handlers: src/handlers-arc
disable_default_cross_chain: true
address_format: lowercase
rollback_on_reorg: true
contracts:
  - name: Eip3009
    events:
      - event: AuthorizationUsed(address indexed authorizer, bytes32 indexed nonce)
  - name: UptoProxy
    events:
      - event: Settled()
      - event: SettledWithPermit()
  - name: UsdcMint
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 value)
chains:
  - id: 5042
    start_block: 0
    hypersync_config:
      url: https://arc.hypersync.xyz
    rpc:
      - url: ${ENVIO_ARC_RPC_URL:-http://rpc-router:4000/sona-history/arc}
        for: fallback
        initial_block_interval: 250
        interval_ceiling: 1000
    contracts:
      - name: Eip3009
        address: "0x3600000000000000000000000000000000000000"
      - name: UptoProxy
        address: "0x4020a4f3b7b90cca423b9fabcc0ce57c6c240002"
        start_block: 19828295
      - name: UsdcMint
        address: "0x3600000000000000000000000000000000000000"
        start_block: 0
